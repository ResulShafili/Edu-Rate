<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bağlantı yoxdur — EduRate</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    font-family: Poppins, "Segoe UI", Tahoma, Arial, sans-serif; color:#1e293b;
    background: linear-gradient(145deg,#f4f7f6,#edf3f1 48%,#f7f5fa); text-align:center; }
  .card { max-width: 420px; display:grid; gap:10px; padding:32px; border:1px solid #e2e8f0;
    border-radius:18px; background:#fff; box-shadow:0 18px 44px -28px rgba(15,40,34,.35); }
  h1 { margin:0; font-size:20px; letter-spacing:-.02em; }
  p { margin:0; color:#64748b; font-size:14px; line-height:1.6; }
  a { display:inline-block; margin-top:8px; padding:11px 18px; color:#fff; text-decoration:none;
    font-size:13px; font-weight:650; border-radius:12px; background:#16423c; }
</style>
</head>
<body>
  <div class="card">
    <h1>İnternet bağlantısı yoxdur</h1>
    <p>EduRate-i açmaq üçün şəbəkəyə qoşul. Bağlantı bərpa olunanda səhifə yenidən yüklənəcək.</p>
    <a href="/">Yenidən cəhd et</a>
  </div>
</body>
</html>
