<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EduRate">
  <defs>
    <linearGradient id="tile" x1="40" y1="24" x2="472" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d5249"/>
      <stop offset="0.52" stop-color="#16423c"/>
      <stop offset="1" stop-color="#0d2c27"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.24" r="0.95">
      <stop offset="0" stop-color="#47897a" stop-opacity="0.6"/>
      <stop offset="0.62" stop-color="#47897a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="board" x1="120" y1="150" x2="392" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9edd7"/>
    </linearGradient>
    <linearGradient id="head" x1="180" y1="232" x2="332" y2="316" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e4e8d1"/>
      <stop offset="1" stop-color="#cdd7b5"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#08201b" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <g filter="url(#soft)">
    <!-- cap head / band -->
    <path d="M182 236 L182 276 C182 302 208 314 256 314 C304 314 330 302 330 276 L330 236 L256 272 Z" fill="url(#head)"/>
    <!-- mortarboard -->
    <path d="M256 150 L410 218 L256 286 L102 218 Z" fill="url(#board)"/>
  </g>

  <!-- tassel cord (starts at board centre) -->
  <path d="M262 214 C352 216 392 220 392 250 L392 302" fill="none" stroke="#f2f1e6" stroke-width="9" stroke-linecap="round"/>
  <!-- tassel knot + lime tuft -->
  <circle cx="392" cy="300" r="9" fill="#f2f1e6"/>
  <path d="M377 306 h30 l-4 34 a11 11 0 0 1 -22 0 Z" fill="#c8ff4d"/>

  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>
</svg>
